<meta name="theme-color" content="#211451">
<link rel="icon" href="foto.jpg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700&display=swap" media="print" onload="this.media='all'">
<style>
:root{--tinta:#211451;--azul:#00499A;--linha:rgba(0,73,154,.15);--r:12px}
*,*::before,*::after{box-sizing:border-box}
*{margin:0}
[hidden]{display:none!important}
@media (prefers-reduced-motion:no-preference){html{scroll-behavior:smooth}}
body{font:400 16px/1.5 Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;color:var(--tinta);background:#fff;-webkit-text-size-adjust:100%;-webkit-font-smoothing:antialiased}
a{color:var(--azul)}
:focus-visible{outline:3px solid var(--azul);outline-offset:2px}
.wrap{max-width:480px;margin-inline:auto;padding-inline:20px}

.topo{background:var(--tinta);color:#fff;text-align:center;padding:40px 0 36px}
.foto{display:block;width:112px;height:112px;margin:0 auto 14px;border-radius:50%;object-fit:cover}
.nome{font-weight:700;font-size:1.125rem}
.cargo{margin-top:2px;font-size:.75rem;letter-spacing:.1em;text-transform:uppercase}
h1{margin-top:24px;font-size:2rem;line-height:1.15;letter-spacing:-.02em;text-wrap:balance}
.sub{margin-top:12px;text-wrap:balance}

section{margin-top:40px;scroll-margin-top:16px}
.rotulo{margin-bottom:16px;font-size:.75rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase}

.card{border:1px solid var(--linha);border-radius:var(--r);scroll-margin-top:16px}
.card+.card{margin-top:12px}
.card>summary{position:relative;display:block;min-height:48px;padding:18px 52px 18px 20px;border-radius:11px;cursor:pointer;list-style:none}
.card>summary::-webkit-details-marker{display:none}
.card>summary::after{content:"";position:absolute;right:22px;top:50%;width:9px;height:9px;border:solid var(--azul);border-width:0 2px 2px 0;transform:translateY(-75%) rotate(45deg)}
.card strong{display:block;font-size:1.125rem;line-height:1.3}
.card>summary span{display:block;margin-top:4px;font-size:.9375rem}
.card[open]{border-color:var(--azul)}
.card[open]>summary{background:var(--azul);color:#fff;border-radius:11px 11px 0 0}
.card[open]>summary::after{border-color:#fff;transform:translateY(-25%) rotate(-135deg)}
.card[open]>summary:focus-visible{outline-color:#fff;outline-offset:-6px}
.corpo{padding:20px}

fieldset{border:0;padding:0;min-width:0}
fieldset+fieldset{margin-top:24px}
legend{padding:0;margin-bottom:12px;font-weight:700}
.opcoes{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.opcao{position:relative}
.opcao:last-child:nth-child(odd){grid-column:1/-1}
.opcao input{position:absolute;inset:0;width:100%;height:100%;margin:0;opacity:0;cursor:pointer}
.opcao span{display:flex;align-items:center;justify-content:center;height:100%;min-height:52px;padding:8px 10px;border:1px solid var(--azul);border-radius:var(--r);background:#fff;text-align:center;font-size:.9375rem;line-height:1.25}
.opcao input:checked+span{background:var(--azul);color:#fff}
.opcao input:focus-visible+span{outline:3px solid var(--azul);outline-offset:2px}

.botao{display:flex;align-items:center;justify-content:center;min-height:52px;margin-top:24px;padding:12px 20px;border-radius:var(--r);background:var(--azul);color:#fff;font-weight:700;text-align:center;text-decoration:none}
.conversar{display:flex;align-items:center;justify-content:center;min-height:48px;margin-top:8px;font-size:.9375rem}

.lista{display:grid;gap:12px;padding:0;list-style:none}
.video{display:flex;align-items:center;gap:14px;min-height:48px;padding:14px 16px;border:1px solid var(--linha);border-radius:var(--r);color:var(--tinta);font-size:.9375rem;font-weight:700;line-height:1.35;text-decoration:none}
.play{position:relative;flex:none;width:36px;height:36px;border-radius:50%;background:var(--azul)}
.play::after{content:"";position:absolute;left:14px;top:11px;border-style:solid;border-width:7px 0 7px 11px;border-color:transparent transparent transparent #fff}

.passos{display:grid;gap:14px;padding:0;list-style:none;counter-reset:p}
.passos li{display:flex;align-items:center;gap:14px;counter-increment:p}
.passos li::before{content:counter(p);flex:none;display:grid;place-items:center;width:32px;height:32px;border-radius:50%;background:var(--azul);color:#fff;font-size:.875rem;font-weight:700}
.nota{margin-top:16px;font-size:.8125rem}
.corpo .nota{margin-top:12px}

.fatos{display:grid;gap:12px}
.fato{padding:14px 16px;border:1px solid var(--linha);border-radius:var(--r);font-size:.9375rem}
.fotos{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px}
.fotos img{display:block;width:100%;height:auto;border-radius:var(--r)}
.fotos figcaption{margin-top:8px;font-size:.875rem;font-weight:700}

.rodape{margin-top:48px;padding-top:24px;padding-bottom:max(40px,env(safe-area-inset-bottom));border-top:1px solid var(--linha);text-align:center}
.links{display:flex;flex-wrap:wrap;justify-content:center;gap:0 20px;padding:0;list-style:none}
.links a{display:inline-flex;align-items:center;min-height:44px;font-size:.875rem}
.legal{margin-top:8px;font-size:.75rem}
</style>
</head>
<body>
<header class="topo"></header>
<main class="wrap"></main>
<footer class="wrap rodape"></footer>

<script>
(() => {
  const C = CONFIG;
  const esc = (s) => String(s).replace(/[&<>"]/g, (ch) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[ch]);
  const semPontoFinal = (s) => s.replace(/[?:]\s*$/, "");
  // pares = [[pergunta, resposta], ...]
  const mensagem = (titulo, pares) =>
    [C.saudacao, titulo + ".", ...pares.map(([p, r]) => `${semPontoFinal(p)}: ${r}.`)].join(" ");
  const whatsapp = (texto) => `https://wa.me/${C.whatsapp}?text=${encodeURIComponent(texto)}`;

  // autoteste: "?" ou ":" no fim da pergunta não vira "?:" na mensagem
  console.assert(mensagem("X", [["A é:", "1"], ["B?", "2"]]) === C.saudacao + " X. A é: 1. B: 2.", "mensagem do WhatsApp");
  console.assert(/^55\d{10,11}$/.test(C.whatsapp), "CONFIG.whatsapp: use 55 + DDD + número, só dígitos");

  document.querySelector(".topo").innerHTML = `<div class="wrap">
    <img class="foto" src="${esc(C.foto)}" alt="Foto de ${esc(C.nome)}" width="112" height="112" fetchpriority="high">
    <p class="nome">${esc(C.nome)}</p>
    <p class="cargo">${esc(C.cargo)}</p>
    <h1>${esc(C.titulo)}</h1>
    <p class="sub">${esc(C.subtitulo)}</p>
  </div>`;

  // chave: índice da pergunta (0, 1) ou "alt" para a pergunta alternativa
  const pergunta = (c, p, chave, oculta) => `<fieldset data-chave="${chave}"${oculta ? " hidden" : ""}><legend>${esc(p.pergunta)}</legend><div class="opcoes">
        ${p.opcoes.map((o) => `<label class="opcao"><input type="radio" name="${esc(c.id)}-${chave}" value="${esc(o)}"><span>${esc(o).replace(/R\$ /g, () => "R$&nbsp;")}</span></label>`).join("")}
      </div></fieldset>`;

  const cartao = (c) => `<details class="card" id="${esc(c.id)}" name="cartoes">
    <summary><strong>${esc(c.titulo)}</strong><span>${esc(c.texto)}</span></summary>
    <div class="corpo">
      ${c.perguntas.map((p, i) => pergunta(c, p, i)).join("")}
      ${c.alternativa ? pergunta(c, c.alternativa, "alt", true) : ""}
      <a class="botao" hidden>${esc(C.inicio.botao)}</a>
      ${c.alternativa ? `<p class="nota" hidden>${esc(c.alternativa.nota)}</p>` : ""}
      <a class="conversar" href="${esc(whatsapp(mensagem(c.titulo, [])))}">${esc(C.inicio.conversar)}</a>
    </div>
  </details>`;

  const videos = C.videos.itens.filter((v) => v.url);
  const T = C.confianca;
  const premio = T.premio.nome ? T.premio : null;
  const palestra = T.palestra.foto ? T.palestra : null;

  document.querySelector("main").innerHTML = `
    <section><h2 class="rotulo">${esc(C.inicio.rotulo)}</h2>${C.inicio.cartoes.map(cartao).join("")}</section>
    ${videos.length ? `<section id="comece"><h2 class="rotulo">${esc(C.videos.rotulo)}</h2><ul class="lista" role="list">
      ${videos.map((v) => `<li><a class="video" href="${esc(v.url)}"><span class="play" aria-hidden="true"></span>${esc(v.titulo)}</a></li>`).join("")}
    </ul></section>` : ""}
    <section><h2 class="rotulo">${esc(C.passos.rotulo)}</h2>
      <ol class="passos" role="list">${C.passos.itens.map((p) => `<li>${esc(p)}</li>`).join("")}</ol>
      <p class="nota">${esc(C.passos.nota)}</p>
    </section>
    <section id="bastidores"><h2 class="rotulo">${esc(T.rotulo)}</h2><div class="fatos">
      <p class="fato"><strong>${esc(C.cargo)}</strong>${T.anos ? ` · ${esc(T.anos)}` : ""}</p>
      ${premio || palestra ? `<div class="fotos">
        ${premio ? `<figure>${premio.foto ? `<img src="${esc(premio.foto)}" alt="${esc(premio.alt || premio.nome)}" loading="lazy">` : ""}<figcaption>${esc(premio.nome)}</figcaption></figure>` : ""}
        ${palestra ? `<figure><img src="${esc(palestra.foto)}" alt="${esc(palestra.alt || `${C.nome} em palestra`)}" loading="lazy"></figure>` : ""}
      </div>` : ""}
      <p class="fato">${esc(T.regulacao)}${T.administradora ? ` Administradora: ${esc(T.administradora)}.` : ""}</p>
      <p class="fato">${esc(T.simulacao)}</p>
    </div></section>`;

  const links = C.rodape.links.filter((l) => l.url);
  document.querySelector(".rodape").innerHTML = `
    ${links.length ? `<nav aria-label="Redes e site"><ul class="links" role="list">${links.map((l) => `<li><a href="${esc(l.url)}">${esc(l.texto)}</a></li>`).join("")}</ul></nav>` : ""}
    ${C.rodape.legal.map((t) => `<p class="legal">${esc(t)}</p>`).join("")}`;

  document.querySelectorAll(".card").forEach((el, n) => {
    const c = C.inicio.cartoes[n];
    const botao = el.querySelector(".botao");
    const valor = (chave) => el.querySelector(`input[name="${c.id}-${chave}"]:checked`)?.value;
    el.addEventListener("change", () => {
      const usaAlt = !!c.alternativa && valor(0) === c.alternativa.quando;
      if (c.alternativa) {
        el.querySelector('[data-chave="1"]').hidden = usaAlt;
        el.querySelector('[data-chave="alt"]').hidden = !usaAlt;
        el.querySelector(".nota").hidden = !usaAlt;
      }
      const ativas = usaAlt ? [[c.perguntas[0], 0], [c.alternativa, "alt"]] : c.perguntas.map((p, i) => [p, i]);
      const pares = ativas.map(([p, chave]) => [p.pergunta, valor(chave)]);
      const completo = pares.every(([, r]) => r);
      if (completo) botao.href = whatsapp(mensagem(c.titulo, pares));
      const apareceu = completo && botao.hidden;
      botao.hidden = !completo; // trocar a 1ª resposta pode deixar a 2ª pergunta sem resposta
      if (apareceu) botao.scrollIntoView({ block: "nearest" });
    });
    // Mantém o endereço com a âncora do cartão aberto, para dar para compartilhar.
    el.addEventListener("toggle", () => {
      if (el.open) {
        if (location.hash !== "#" + el.id) history.replaceState(null, "", "#" + el.id);
        if (el.getBoundingClientRect().top < 0) el.scrollIntoView(); // fechar o cartão de cima pode empurrar este para fora da tela
      } else if (location.hash === "#" + el.id) {
        history.replaceState(null, "", location.pathname + location.search);
      }
    });
  });

  const abrirDoEndereco = () => {
    const el = document.getElementById(decodeURIComponent(location.hash.slice(1)));
    if (!el || !el.matches(".card, section[id]")) return;
    if (el.matches(".card")) el.open = true;
    el.scrollIntoView({ behavior: "instant" }); // rolagem suave é cancelada durante o carregamento
  };
  abrirDoEndereco();
  addEventListener("hashchange", abrirDoEndereco);
})();
</script>
</body>
</html>
